name: Android APK

# 占位 workflow：只验证 Flutter 工程能出 release APK。
# 真正的打包配置（签名、多 ABI、产物上传等）由打包子代理后续补。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable

      - run: flutter pub get
      - run: flutter build apk --release
